<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Drive Authorization - Lilverse</title>
  <style>
    body {
      background-color: #000000;
      color: #F5F5F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #292929;
      border-top-color: #E8E8E8;
      border-radius: 50%;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    p {
      color: #999999;
      font-size: 13px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h2 id="title">Connecting Centralized Google Drive...</h2>
  <p id="desc">Completing secure server authorization for Lilverse.</p>
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');

      const titleEl = document.getElementById('title');
      const descEl = document.getElementById('desc');
      const spinnerEl = document.getElementById('spinner');

      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      if (error) {
        if (spinnerEl) spinnerEl.style.display = 'none';
        if (titleEl) titleEl.textContent = 'Authorization Failed';
        if (descEl) {
          descEl.style.color = '#f87171';
          descEl.textContent = error;
        }
      } else if (code) {
        if (titleEl) titleEl.textContent = 'Authorization Successful';
        if (descEl) descEl.textContent = 'Returning to Lilverse Settings...';
      } else {
        if (spinnerEl) spinnerEl.style.display = 'none';
        if (titleEl) titleEl.textContent = 'Authorization Incomplete';
        if (descEl) descEl.textContent = 'No authorization code received from Google.';
      }

      if (window.opener) {
        try {
          window.opener.postMessage({
            type: 'LILVERSE_DRIVE_AUTH_RESULT',
            code,
            state,
            error
          }, '*');
        } catch (e) {
          console.error('Failed to communicate with opener window', e);
        }
        setTimeout(function() {
          try {
            window.close();
          } catch (e) {
            // ignore
          }
        }, 1500);
      } else {
        if (spinnerEl) spinnerEl.style.display = 'none';
        if (titleEl) titleEl.textContent = 'Authorization Finished';
        if (descEl) descEl.textContent = 'You can now close this window and return to Lilverse.';
      }
    })();
  </script>
</body>
</html>
